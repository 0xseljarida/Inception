# Standalone daemon: vsftpd binds port 21 itself instead of waiting for inetd.
listen=YES

# Who may log in: a real system account, never anonymous.
anonymous_enable=NO
local_enable=YES
pam_service_name=vsftpd

# What that account may do: every write command is refused by default.
write_enable=YES

# Where the session is confined. The WordPress volume is writable, so
# vsftpd 3 needs the waiver to accept a writable jail root.
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/var/www/html

# The jail of the unprivileged pre-authentication process. Must exist.
secure_chroot_dir=/var/run/vsftpd/empty

# Passive mode: the client opens the data connection, so vsftpd must
# advertise an address and a port range the client can actually reach.
pasv_address=127.0.0.1
pasv_min_port=21100
pasv_max_port=21110

# Log every transfer.
xferlog_enable=YES
