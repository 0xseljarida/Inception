server {
	listen 443 ssl;
	listen [::]:443 ssl;

	# Set server name
	server_name sel-jari.42.fr;

	# Set certificate and key
	ssl_certificate_key /etc/nginx/ssl/sel-jari.key;
	ssl_certificate /etc/nginx/ssl/sel-jari.crt;
	ssl_protocols TLSv1.2 TLSv1.3;

	# -------------------------------------------------------#
	# -------------------- WORDPRESS ------------------------#
	# -------------------------------------------------------#

	root /var/www/html/;

	# Set index file
	index index.php;

	# Forward PHP calls to FastCGI server
	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_pass wordpress:9000;
	}

	# -------------------------------------------------------#
	# --------------------- ADMINER -------------------------#
	# -------------------------------------------------------#

	# Send every /adminer/ request to the single Adminer PHP file,
	# which lives in the adminer container, not in this one.
	location ^~ /adminer/ {
		include fastcgi_params;
		fastcgi_pass adminer:9000;
		fastcgi_param SCRIPT_FILENAME /var/www/adminer/index.php;
	}

	location = /adminer {
		return 301 /adminer/;
	}
}
